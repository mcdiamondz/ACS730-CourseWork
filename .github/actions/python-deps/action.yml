name: python-deps
description: Set up Python and install this lab's dependencies, with a pip cache.

inputs:
  python-version:
    description: Python version to set up
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          lab4/requirements.txt
          lab4/requirements-dev.txt
    # Every run: step in a composite action MUST declare a shell.
    - shell: bash
      run: python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt
