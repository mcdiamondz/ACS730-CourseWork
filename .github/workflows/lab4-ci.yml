name: lab4-ci

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level default. Every job inherits it unless it says otherwise.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one red cell must not cancel the others
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python and dependencies (composite action)
        uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: lab4
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image-tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: acs730-lab4:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save acs730-lab4:${{ steps.meta.outputs.image-tag }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - name: Smoke test /healthz
        env:
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker run -d --name app -p 8000:8000 "acs730-lab4:$TAG"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  publish:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read     # restated on purpose -- a job-level block replaces the workflow-level one
      packages: write    # the only widening in the whole workflow
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by SHA
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/acs730-lab4
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          docker build -t "$IMAGE:$TAG" lab4/
          docker push "$IMAGE:$TAG"

  # Reusable workflow: a whole job with its own runner and permissions.
  # A calling job has uses: and with: -- no runs-on and no steps.
  image:
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      context: lab4
      image-name: acs730-lab4
      push: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

  report:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - run: echo "built ${{ needs.image.outputs.image-ref }}"

  summary:
    needs: [test, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "test ${{ needs.test.result }} build ${{ needs.build.result }} smoke ${{ needs.smoke.result }} tag ${{ needs.build.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Re-raise an upstream failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
