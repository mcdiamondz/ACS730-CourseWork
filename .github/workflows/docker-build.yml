name: docker-build

# workflow_call is what makes this callable. It never runs on its own.
on:
  workflow_call:
    inputs:
      context:    { required: true,  type: string }
      image-name: { required: true,  type: string }
      push:       { required: false, type: boolean, default: false }
    outputs:
      image-ref:
        value: ${{ jobs.build.outputs.image-ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image-ref=ghcr.io/$OWNER/${{ inputs.image-name }}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.ref.outputs.image-ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
